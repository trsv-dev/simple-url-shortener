syntax = "proto3";

package grpc_server;

option go_package="github.com/trsv-dev/simple-url-shortener/internal/shortener/proto";

import "google/protobuf/empty.proto";

message PostRequest {
  string original_url = 1;
}

message PostResponse {
  string shortened_url = 1;
}

message ShortenRequest {
  string original_url = 1;
}

message ShortenResponse {
  string shortened_url = 1;
}

message ShortenBatchRequest {
  message URL {
    string correlation_id = 1;
    string original_url = 2;
    string short_url = 3;
  }

  repeated URL urls = 1;
}

message ShortenBatchResponse {
  message URL {
    string correlation_id = 1;
    string original_url = 2;
    string short_url = 3;
  }

  repeated URL urls = 1;
}

message GetOriginalURLRequest {
  string short_url = 1;
}

message GetOriginalURLResponse {
  string original_url = 1;
}

message UserURL {
  string original_url = 1;
  string short_url = 2;
}

message GetUserURLsResponse {
  repeated UserURL user_urls = 1;
}

message DeleteURLsRequest {
  repeated string short_urls = 1;
}

message GetStatsResponse {
  uint32 users_amount = 1;
  uint32 urls_amount = 2;
}

message GetTokenResponse {
  string token = 1;
}

service URLShortenerService {
  rpc Post(PostRequest) returns (PostResponse) {};
  rpc Shorten(ShortenRequest) returns (ShortenResponse) {};
  rpc ShortenBatch(ShortenBatchRequest) returns (ShortenBatchResponse) {};
  rpc GetOriginalURL(GetOriginalURLRequest) returns (GetOriginalURLResponse) {};
  rpc GetUserURLs(google.protobuf.Empty) returns (GetUserURLsResponse) {};
  rpc DeleteURLs(DeleteURLsRequest) returns (google.protobuf.Empty) {};
  rpc Stats(google.protobuf.Empty) returns (GetStatsResponse) {};
  rpc PingDB(google.protobuf.Empty) returns (google.protobuf.Empty) {};
  rpc GetToken(google.protobuf.Empty) returns (GetTokenResponse) {}
}